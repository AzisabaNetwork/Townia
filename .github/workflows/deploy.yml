name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths-ignore:
      - "**.md"
      - "renovate.json"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Prepare gradle.properties
        run: |
          mkdir -p $HOME/.gradle
          echo "azisabaNmsUsername=${{ secrets.NEWREPO_USERNAME }}" >> $HOME/.gradle/gradle.properties
          echo "azisabaNmsPassword=${{ secrets.NEWREPO_PASSWORD }}" >> $HOME/.gradle/gradle.properties
          echo "repoUsername=${{ secrets.NEWREPO_USERNAME }}" >> $HOME/.gradle/gradle.properties
          echo "repoPassword=${{ secrets.NEWREPO_PASSWORD }}" >> $HOME/.gradle/gradle.properties

      - name: Check if version is already published
        id: check
        run: |
          VERSION=$(grep '^version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "published=false" >> $GITHUB_OUTPUT
          else
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' "https://maven.azisaba.net/releases/net/azisaba/Townia/$VERSION/Townia-$VERSION.pom")
            if [ "$STATUS" = "200" ]; then
              echo "published=true" >> $GITHUB_OUTPUT
            else
              echo "published=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Build only (version already published)
        if: steps.check.outputs.published == 'true'
        run: |
          echo "Version ${{ steps.check.outputs.version }} is already published; skipping publish. Bump version in gradle.properties to release."
          ./gradlew clean test shadowJar

      - name: Deploy
        if: steps.check.outputs.published != 'true'
        run: ./gradlew clean test publish