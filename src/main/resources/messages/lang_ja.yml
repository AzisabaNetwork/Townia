      desc: "国の住民に国の役職を付け外しします。"
    delete:
      usage: "/nation delete confirm"
      desc: "国を解散します（国王のみ）。誤操作防止のため confirm が必要です。"

  plot:
    info:
      usage: "/plot info"
      desc: "今いる区画の情報（所有者・権限・設定）を表示します。/plot here, /plot perm でも同じです。"
    set:
      type:
        usage: "/plot set type <種類>"
        desc: "区画の種類を変更します。"
        detail:
          - "種類: default（通常）, shop（店）, arena（闘技場）, embassy（大使館）, farm（農場）, inn（宿）"
          - "/plot set shop のように type を省略しても指定できます。"
      name:
        usage: "/plot set name <名前>"
        desc: "区画に名前を付けます。"
      perm:
        usage: "/plot set perm [グループ] [行動] <on|off>"
        desc: "区画の権限を設定します（区画の所有者、または町の補佐以上）。"
        detail:
          - "グループ: friend（フレンド）, resident（町の住民）, nation（同じ国）, ally（同盟国）, outsider（その他）"
          - "行動: build（設置）, destroy（破壊）, switch（ドア・ボタン等）, itemuse（アイテム使用）"
          - "グループや行動を省略すると、すべてに適用されます。"
          - "例: /plot set perm friend build on"
      reset:
        usage: "/plot set reset"
        desc: "区画の権限を所有者（または町）の標準設定に戻します。/plot set perm reset でも同じです。"
    toggle:
      usage: "/plot toggle <pvp|mobs|explosions|fire>"
      desc: "区画のPvP・モブ・爆発・延焼の設定を切り替えます。"
    forsale:
      usage: "/plot forsale [価格] [rect|circle <半径>]"
      desc: "今いる区画を売りに出します（/plot fs でも可）。"
      detail:
        - "価格を省略すると町の標準価格（/town set plotprice）になります。"
        - "rect（四角）または circle（円）と半径を付けると、周囲の区画もまとめて売りに出します。"
        - "例: /plot fs 1000 rect 2"
    notforsale:
      usage: "/plot notforsale [rect|circle <半径>]"
      desc: "区画の売出を取り消します（/plot nfs でも可）。範囲指定もできます。"
    buy:
      usage: "/plot buy [auto]"
      desc: "今いる売出中の区画を購入します（/plot claim でも可）。"
      detail:
        - "auto を付けると、周囲（半径3チャンクの円内）にある自分の町の売出中の区画を、所持金が足りる分だけまとめて購入します。"
    unclaim:
      usage: "/plot unclaim"
      desc: "自分の区画を町に返します（町長・補佐はほかの人の区画も返せます）。"
    clear:
      usage: "/plot clear"
      desc: "区画の名前・種類・PvP等の設定・権限を初期状態に戻し、区画内の看板を取り除きます（町長または区画の所有者）。"
    evict:
      usage: "/plot evict"
      desc: "区画の所有者を退去させ、町の所有に戻します（町の補佐以上）。"

