        desc: "アウトポストへテレポートします。町名を省略すると自分の町のアウトポストです。"
      togglepublic:
        usage: "/town outpost togglepublic <番号>"
        desc: "アウトポストを他の町の人にも公開するか切り替えます（補佐以上）。"
      rename:
        usage: "/town outpost rename <番号> <名前>"
        desc: "アウトポストに名前を付けます（補佐以上、64文字まで）。"
    invite:
      usage: "/town invite <プレイヤー>"
      desc: "プレイヤーを町に招待します。招待されたプレイヤーは /invite accept で参加できます。"
    kick:
      usage: "/town kick <プレイヤー>"
      desc: "住民を町から追放します。"
    rank:
      add:
        usage: "/town rank add <プレイヤー> <役職>"
        desc: "住民に役職を付けます（町長のみ）。"
        detail:
          - "役職は townyperms.yml に書かれた物です（assistant, helper, sheriff, sub_mayor など）。"
          - "付けられるのは towny.command.town.rank.<役職> の権限を持つ役職だけです。"
      remove:
        usage: "/town rank remove <プレイヤー> [役職]"
        desc: "住民から役職を外します。役職を省くと全部外します。"
    set:
      spawn:
        usage: "/town set spawn"
        desc: "今いる場所を町のスポーン地点にします（補佐以上）。"
      homeblock:
        usage: "/town set homeblock"
        desc: "今いるチャンクを町のホームブロックにします（補佐以上、町の土地内のみ）。"
      name:
        usage: "/town set name <新しい町名>"
        desc: "町の名前を変更します（町長のみ）。"
      board:
        usage: "/town set board <メッセージ>"
        desc: "町の掲示板（/town info に表示されるメッセージ）を設定します（町長のみ）。"
      taxes:
        usage: "/town set taxes <金額>"
        desc: "住民から毎日徴収する町税を設定します（町長のみ）。"
        detail:
          - "/town toggle taxpercent をONにすると、金額ではなく所持金に対する割合（%）として扱われます。"
      plotprice:
        usage: "/town set plotprice <金額>"
        desc: "区画を売りに出すときの標準価格を設定します。"
      public:
        usage: "/town set public"
        desc: "町を公開にし、他の町の人も /town spawn で来られるようにします（町長のみ）。"
      private:
        usage: "/town set private"
        desc: "町を非公開にします（町長のみ）。"
      perm:
        usage: "/town set perm [グループ] [行動] <on|off>"
        desc: "町の土地での権限を設定します（補佐以上）。引数なしで現在の設定を表示します。"
        detail:
          - "グループ: resident（住民）, nation（同じ国）, ally（同盟国）, outsider（その他）"
          - "行動: build（設置）, destroy（破壊）, switch（ドア・ボタン等）, itemuse（アイテム使用）"
          - "グループや行動を省略すると、すべてに適用されます。"
          - "例: /town set perm outsider build off"
      jail:
        usage: "/town set jail"
        desc: "今いる場所を町の牢屋にします（補佐以上）。"
      mayor:
        usage: "/town set mayor <住民>"
        desc: "町長を同じ町の住民に交代します。"
      tag:
        usage: "/town set tag <タグ|clear>"
        desc: "町のタグ（4文字まで）を設定します。"
      plottax:
        usage: "/town set plottax <金額>"
        desc: "区画の持ち主が毎日払う税を設定します。"
      shoptax:
        usage: "/town set shoptax <金額>"
        desc: "店区画の持ち主が毎日払う税を設定します。"
      embassytax:
        usage: "/town set embassytax <金額>"
        desc: "大使館区画の持ち主が毎日払う税を設定します。"
      shopprice:
        usage: "/town set shopprice <金額>"
        desc: "店区画を売りに出すときの標準の値段を設定します。"
      embassyprice:
        usage: "/town set embassyprice <金額>"
        desc: "大使館区画を売りに出すときの標準の値段を設定します。"
      spawncost:
        usage: "/town set spawncost <金額>"
        desc: "よその人がこの町のスポーンへ移動するときの料金を設定します。"
    toggle:
      usage: "/town toggle <pvp|mobs|explosions|fire|open|public|taxpercent> [on|off]"
      desc: "町の設定をON/OFFします（町長のみ）。on/off を省略すると切り替えます。"
      detail:
        - "pvp: PvP / mobs: モブのスポーン / explosions: 爆発 / fire: 延焼"
        - "open: 招待なしで /town join で参加できるようにする"
        - "public: 他の町の人も /town spawn で来られるようにする"
        - "taxpercent: 町税を金額ではなく割合（%）にする"
    deposit:
      usage: "/town deposit <金額>"
      desc: "所持金を町の銀行に入金します。"
    withdraw:
      usage: "/town withdraw <金額>"
      desc: "町の銀行から出金します。"
    bankhistory:
      usage: "/town bankhistory [件数]"
      desc: "町の銀行の入出金履歴を表示します（1〜50件、既定10件）。"
    outlaw:
      usage: "/town outlaw <add|remove|list> [プレイヤー]"
      desc: "町のアウトロー（お尋ね者）を登録・解除・一覧表示します（補佐以上）。"
    outlawlist:
      usage: "/town outlawlist [町名]"
      desc: "町のアウトロー一覧を表示します。"
    jail:
      usage: "/town jail <プレイヤー> [時間] [保釈金] [牢屋]"
      desc: "同じ町の住民を投獄します（補佐以上）。"
      detail:
        - "時間は時間（hour）単位で、省略すると1時間です。保釈金は省略すると0です。"
        - "牢屋は /town jailcell で追加した牢屋の番号か名前です。省略すると /town set jail の場所です。"
        - "引数なし、または list で牢屋の情報を表示します。"
        - "投獄された人は /resident jail paybail で保釈金を払って出られます。"
    unjail:
      usage: "/town unjail <プレイヤー>"
      desc: "投獄中の住民を釈放します（補佐以上）。"
    jailcell:
      usage: "/town jailcell <add [名前]|remove <番号|名前>|list>"
      desc: "町の牢屋（独房）を追加・削除・一覧表示します（補佐以上）。add は今いる場所に追加します。"
    map:
      usage: "/town map"
      desc: "周辺の土地のマップを表示します。"
    buy:
      usage: "/town buy bonus <数>"
      desc: "町の銀行のお金で、取得できる土地の枠を増やします。"
    say:
      usage: "/town say <メッセージ>"
      desc: "オンラインの町の住民全員にメッセージを送ります。"
    menu:
      usage: "/town menu"
      desc: "町のメニュー画面（GUI）を開きます。"
    delete:
      usage: "/town delete confirm"
      desc: "町を削除します（町長のみ）。誤操作防止のため confirm が必要です。"

  nation:
