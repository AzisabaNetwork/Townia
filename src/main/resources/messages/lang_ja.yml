    deletenation:
      usage: "/towniaadmin deletenation <国名>"
      desc: "国を強制的に解散します。"
    givebonus:
      usage: "/towniaadmin givebonus <町名> <数>"
      desc: "町が取得できる土地の上限にボーナスを設定します。"
    setmayor:
      usage: "/towniaadmin setmayor <町名> <プレイヤー|UUID>"
      desc: "プレイヤーを町長にし、元の町長は一般住民に戻します。町に未所属なら町に加えます。"
      detail:
        - "/towniaadmin setrank <町名> <プレイヤー> mayor と同じです。"
    addresident:
      usage: "/towniaadmin addresident <町名> <プレイヤー|UUID>"
      desc: "町に未所属のプレイヤーを強制的に町の住民にします（招待不要）。"
      detail:
        - "別の町に所属している場合は追加できません。移すには /towniaadmin moveresident を使います。"
        - "対象がその町のアウトローだった場合は解除されます。"
    setsubmayor:
      usage: "/towniaadmin setsubmayor <町名> <プレイヤー|UUID>"
      desc: "プレイヤーを町の副町長にします。町に未所属なら町に加えます。"
      detail:
        - "/towniaadmin setrank <町名> <プレイヤー> sub_mayor と同じです。"
    setassistant:
      usage: "/towniaadmin setassistant <町名> <プレイヤー|UUID>"
      desc: "プレイヤーを町の補佐にします。町に未所属なら町に加えます。"
      detail:
        - "/towniaadmin setrank <町名> <プレイヤー> assistant と同じです。"
    setrank:
      usage: "/towniaadmin setrank <町名> <プレイヤー|UUID> <resident|assistant|sub_mayor|mayor>"
      desc: "町でのプレイヤーの役職を設定します。resident で一般住民に戻します。町に未所属なら町に加えます。"
      detail:
        - "setmayor・setsubmayor・setassistant はこのコマンドの省略形で、ルールも同じです。"
        - "別の町の住民は指定できません。先に /towniaadmin moveresident で移してください。"
        - "mayor を指定すると町長になり、元の町長は一般住民になります。今の町長を降格することはできないので、先に別の人を町長にしてください。"
    moveresident:
      usage: "/towniaadmin moveresident <町名> <プレイヤー|UUID>"
      desc: "別の町に所属していても、プレイヤーを強制的に指定の町へ移します（一般住民として）。"
      detail:
        - "元の町からは脱退扱いになり、元の町で所有していた区画は手放されます。"
        - "町長は移せません。先にその町の別の町長を設定してください。"
        - "対象がオンラインなら通知されます。"
    kickresident:
      usage: "/towniaadmin kickresident <プレイヤー|UUID>"
      desc: "プレイヤーを所属している町から外します。町で所有していた区画は手放されます。"
      detail:
        - "町長は外せません。先にその町の別の町長を設定してください。"
    mergeresident:
      usage: "/towniaadmin mergeresident <統合元の名前|UUID> <統合先の名前|UUID>"
      desc: "重複した住民データを1つに統合します。"
    dedupe:
      usage: "/towniaadmin dedupe [confirm]"
      desc: "オフラインUUIDで重複した住民を検出します。confirm を付けると統合を実行します。"
    migrate:
      usage: "/towniaadmin migrate [data [対象] [オプション] | only ... | config]"
      desc: "Townyからデータや設定を移行します。"
      detail:
        - "repair [confirm]: 以前の移行で起きた「所属が前の町になっている」「区画の持ち主が消えた」「町長が2人いる」を、Towny のファイルを元に直します。confirm を付けない間は調べるだけです。"
        - "audit: Towny の設定とデータを読むだけで、何を使っていたかを towny-compat/audit.yml に書き出します。"
        - "only town <町名>: その町だけ（設定・住民・区画・追放者・牢屋）を移行します。"
        - "only resident <名前>: その住民だけ（設定・フレンド・所有区画）を移行します。"
        - "only に settings-only を付けると、町や住民の設定だけを移行します。"
        - "対象: all, towns, nations, residents, townblocks, jails, outlaws, relations"
        - "オプション: skip-profiles, missing-only, prune"
        - "config: Townyの config.yml の設定を移行します。"
        - "/towniaadmin migrate diagnose <プレイヤー> で町の所属を診断します。"

  towniaworld:
    list:
      usage: "/towniaworld list"
      desc: "町を作れるワールドの一覧を表示します。"
    add:
      usage: "/towniaworld add <ワールド>"
      desc: "町を作れるワールドを追加します。"
    remove:
      usage: "/towniaworld remove <ワールド>"
      desc: "町を作れるワールドから削除します。"

  invite:
    list:
      usage: "/invite list"
      desc: "届いている町からの招待を表示します。"
    accept:
      usage: "/invite accept [町名]"
      desc: "招待を承諾して町に参加します。町名を省略すると最も古い招待を承諾します。"
    decline:
      usage: "/invite decline <町名>"
      desc: "町からの招待を断ります。"

  townconfig:
    set:
      usage: "/townconfig <allowInvisibility|allowSit|allowPetPickup|allowPassenger> <true|false>"
      desc: "町の土地で透明化・座る・ペットを持ち上げる・他のプレイヤーに乗ることを許可するか設定します（町長のみ）。"
