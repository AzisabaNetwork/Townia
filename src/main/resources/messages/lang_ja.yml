        desc: "首都を別の加盟町に変更します（国王のみ）。"
      title:
        usage: "/nation set title <プレイヤー> [称号]"
        desc: "国民に名前の前に付く称号を設定します（国王のみ）。称号を省略すると削除します。"
      surname:
        usage: "/nation set surname <プレイヤー> [名前]"
