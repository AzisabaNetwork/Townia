      desc: "敵対国を追加・削除します（国王のみ）。"
    toggle:
      usage: "/nation toggle <neutral|public|open>"
      desc: "国の中立・公開（スポーン移動）・オープン（招待なしで加入）を切り替えます。"
    rank:
