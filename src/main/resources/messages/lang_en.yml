townia:
  price:
    - "<gold>Town/Nation Creation & Upkeep Costs"
    - "<gray>New Town: <white>{town_create}"
    - "<gray>New Nation: <white>{nation_create}"
    - "<gray>Claim Plot: <white>{claim}"
    - "<gray>Town Upkeep: <white>{town_upkeep}/day"
  time:
    - "<gold>Time until next upkeep: <white>{hours}h {minutes}m"
  top-entry-nation: "<yellow>{rank}. {nation} <gray>| Land: <white>{claims} <gray>| Towns: <white>{towns}"
  top-entry-resident: "<yellow>{rank}. {player} <gray>| Land: <white>{claims}"
  top-entry-town: "<yellow>{rank}. {town} <gray>| Land: <white>{claims} <gray>| Residents: <white>{residents}"
  top-header: "<green>=== Ranking: {type} ==="
  top-label-residents-all: "Residents (All)"
  top-label-residents-town: "Residents (Town)"
  top-label-residents-nation: "Residents (Nation)"
  top-label-land-all: "Land Owned (All)"
  top-label-land-town: "Land Owned (Town)"
  top-label-land-nation: "Land Owned (Nation)"
  top-label-land-resident: "Land Owned (Resident)"
  map-header: "<dark_gray>================ <gold>Townia Map <dark_gray>================"
  debug-header: "<yellow>--- Townia Debug Info ---"
