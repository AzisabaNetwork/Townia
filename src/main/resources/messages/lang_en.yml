  diagnose-townia-name-lookup: "<yellow>Townia name lookup differs: <white>{uuid} <gray>(town={town}, uuid={town_uuid}, nation={nation}, nation_uuid={nation_uuid})"
  diagnose-footer: "<gray>Copy these lines from console/chat when reporting the result."
  help:
    - "<gold>Admin commands: <gray>/towniaadmin reload, bypass, setclaim, unclaim, deletetown, deletenation, givebonus, migrate, dedupe, mergeresident"

