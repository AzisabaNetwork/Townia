  debug-actionbar-error: "<red>ActionBar error: {error}"
  debug-title-ok: "<yellow>Sent Title test successfully."
  debug-title-error: "<red>Title error: {error}"
  help:
    - "<gold>/townia <gray>- Show Townia help"
    - "<gold>/townia map <gray>- Show nearby map"
    - "<gold>/townia price <gray>- Show prices"
